# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Gan Zhen Hao"
description              : "" # shown in the sidebar when set; the search/link-preview description lives in _pages/about.md
seo_name                 : "Zhen Hao Gan" # name order used on papers; used for <title>, link previews, and search metadata
seo_tagline              : "Robotics PhD Student, University of Michigan"
url                      : "https://ganzh6880.github.io"
repository               : "ganzh6880/ganzh6880.github.io"

# Publication teasers are pulled live from each project page (see _data/publications.yml).
# Teaser images are resized through this free image proxy (wsrv.nl) so an 8 MB figure becomes a ~50 KB thumbnail;
# if the proxy is down the original file is used. Set to "" to always load the original files.
teaser_image_proxy       : "https://wsrv.nl/?url={url}&w={width}&output=webp"

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related
