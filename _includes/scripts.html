<script src="{{ '/assets/js/publications.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

<script>
  // Keep "first-year"/"second-year"/... current even when the site hasn't been rebuilt since the last anniversary.
  (function () {
    var words = ['first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth'];
    Array.prototype.forEach.call(document.querySelectorAll('.phd-year[data-start]'), function (el) {
      var p = el.getAttribute('data-start').split('-');
      var start = new Date(+p[0], +p[1] - 1, +p[2]);
      var now = new Date();
      var year = now.getFullYear() - start.getFullYear() + 1;
      var beforeAnniversary = now.getMonth() < start.getMonth() ||
        (now.getMonth() === start.getMonth() && now.getDate() < start.getDate());
      if (beforeAnniversary) year -= 1;
      if (year >= 1) el.textContent = words[year - 1] || year + 'th';
    });
  })();
</script>

<script>
  // News: CSS hides the older items; add the button that shows them.
  (function () {
    Array.prototype.forEach.call(document.querySelectorAll('.news-list'), function (box) {
      var items = box.querySelectorAll(':scope > ul > li');
      var hiddenCount = Array.prototype.filter.call(items, function (li) {
        return getComputedStyle(li).display === 'none';
      }).length;
      if (!hiddenCount) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'news-toggle';
      var update = function () {
        var open = box.classList.contains('is-expanded');
        btn.setAttribute('aria-expanded', String(open));
        btn.textContent = open ? 'Show less' : 'Show older news (' + hiddenCount + ')';
      };
      btn.addEventListener('click', function () { box.classList.toggle('is-expanded'); update(); });
      update();
      box.appendChild(btn);
    });
  })();
</script>
