#   project, paper, arxiv, code, video   links (all optional)
#
# Pulled live from the `project` page when the homepage is viewed (nothing is copied into this repo):
#   teaser   the first image or video on the project page whose file name contains "teaser"
#            (e.g. assets/images/teaser.png or assets/videos/teaser.mp4); if none is named that way,
#            the first image or video on the page. Set `teaser:` to a URL here to override.
