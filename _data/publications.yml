#
# An entry without `project` or `teaser` is shown as text only.

- title: "PhyGS: Physically-Grounded Controllable Scene Generation"
  authors: "Aparajito Saha, Zhen Hao Gan, Jinjia Guo, Jacob Skwirsk, Jeremy Acheampong, Anton Arapin, Chahyon Ku, Yue Hu, Nima Fazeli, Bernadette Bucher"
  venue: "CVPR Workshop on Multi-Agent Embodied Intelligent Systems, 2026"
  badge: "CVPR 2026 Workshop"
  project: "https://m-and-m-lab.github.io/PhyGS/"
  paper: "https://m-and-m-lab.github.io/PhyGS/assets/papers/phygs.pdf"
  code: "https://github.com/m-and-m-lab/PhyGS"
  summary: "PhyGS generates controllable, photorealistic, and physically interactive building-scale scenes in IsaacSim, with a hardware abstraction for sim-to-real deployment on Boston Dynamics Spot."

- title: "ForageBench: A Photorealistic, Physically Grounded Benchmark for Interactive Object Search"
  authors: "Aparajito Saha, Zhen Hao Gan, Jinjia Guo, Jacob Skwirsk, Jeremy Acheampong, Anton Arapin, Chahyon Ku, Yue Hu, Nima Fazeli, Bernadette Bucher"
  venue: "2026"
  badge: "2026"
  project: "https://m-and-m-lab.github.io/ForageBench/"
  paper: "https://m-and-m-lab.github.io/ForageBench/assets/papers/foragebench.pdf"
  code: "https://github.com/m-and-m-lab/ForageBench"
  summary: "ForageBench evaluates interactive object search across 25 house-scale scenes and 100 episodes, combining long-horizon navigation with fine-grained physical interaction."
